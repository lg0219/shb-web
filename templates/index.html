<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHB 数据</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

/* ── 设计令牌（2026-11-11 unslop：石墨灰 + 仪表绿）── */
:root{
  /* 取色自售后宝正式系统（2026-11-11 hunter 提供截图）：侧栏 #21333f，主色青 #13c2c2 */
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f9fafc; --surface-3:#edf1f5;
  --line:rgba(33,51,63,.10); --line-2:rgba(33,51,63,.17);
  --ink:#1e2c37; --ink-2:#5a6873; --ink-3:#818d97;
  --accent:#10b0b0; --accent-ink:#0d9a9a; --accent-soft:rgba(19,194,194,.16);
  --accent-bright:#13c2c2;
  --btn-export:#12855b; --btn-export-ink:#0d6344; --btn-export-soft:rgba(18,133,91,.10);
  --btn-save:#c2761b; --btn-save-ink:#9c5c13; --btn-save-soft:rgba(194,118,27,.10);
  --danger:#c0392b; --danger-soft:rgba(192,57,43,.08);
  /* 2026-11-12 hunter 要求：侧栏文字原来偏暗、发浑（#d8e2e8 带蓝灰调），提亮到近白
     --side-ink  #d8e2e8 → #f2f7fa（主文字：菜单项 / 分组标题 / 用户名）
     --side-ink-2 #9aacb8 → #c2d1db（次级：图标 / 折叠箭头 / 退出登录）
     底色 #2b4353 不变；对比度 7.4:1 → 9.2:1 */
  /* 2026-11-12 hunter 要求：侧栏文字原来偏暗、发浑（#d8e2e8 带蓝灰调），分两步提亮
     第一步 #d8e2e8 → #f2f7fa（hunter：好多了，但还可以再亮一点）
     第二步 #f2f7fa → #ffffff（主文字到顶）；--side-ink-2 #c2d1db → #d3e0e8
     悬停/激活仍靠背景 #35505f 区分，不再靠文字变白 */
  --side:#2b4353; --side-2:#35505f; --side-ink:#ffffff; --side-ink-2:#d3e0e8;
  --r-sm:8px; --r-md:12px; --r-lg:14px;
  --focus:0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
}

body { font-family:-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif; background:var(--bg); color:var(--ink); height:100vh; overflow:hidden; font-size:14px; -webkit-font-smoothing:antialiased; }
.app { display:flex; height:100vh; }

/* ── 侧边栏 ── */
.sidebar { width:248px; flex:0 0 248px; background:var(--side); color:var(--side-ink); display:flex; flex-direction:column; transition:margin-left .16s ease; }
.sidebar.hidden { margin-left:-248px; }
.side-head { height:56px; display:flex; align-items:center; gap:10px; padding:0 20px; font-size:15px; font-weight:600; color:#fff; border-bottom:1px solid rgba(255,255,255,.07); }
.brand-mark { width:20px; height:20px; flex:0 0 20px; color:var(--accent); }
.menu { flex:1; overflow-y:auto; padding:12px 0; }
.group + .group { margin-top:8px; }
.group-title { display:flex; align-items:center; justify-content:space-between; font-size:15px; font-weight:600; color:var(--side-ink); padding:10px 20px; cursor:pointer; user-select:none; }
.gicon { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; margin-right:10px; color:var(--side-ink-2); vertical-align:middle; }
.gicon svg { width:16px; height:16px; stroke-width:1.5; }
.group-title:hover { color:var(--side-ink); }
.group-title .caret { font-size:10px; color:var(--side-ink-2); transition:transform .15s ease; }
.group.collapsed .group-title .caret { transform:rotate(-90deg); }
.group.collapsed .group-items { display:none; }
/* 签名细节：每行左侧 3px 刻度线，激活时点亮为仪表绿 */
.item { position:relative; display:flex; align-items:center; gap:8px; padding:9px 20px 9px 52px; font-size:13.5px; color:var(--side-ink); cursor:pointer; white-space:nowrap; transition:background-color .12s ease,color .12s ease; }
.item::before { content:""; position:absolute; left:36px; top:50%; width:3px; height:14px; margin-top:-7px; background:rgba(255,255,255,.16); border-radius:1.5px; transition:background-color .12s ease,height .12s ease,margin-top .12s ease; }
.item:hover { background:var(--side-2); color:#fff; }
.item.active { background:var(--side-2); color:#fff; }
.item.active::before { background:var(--accent-bright); height:18px; margin-top:-9px; }
.side-foot { height:56px; display:flex; align-items:center; gap:10px; padding:0 20px; border-top:1px solid rgba(255,255,255,.07); font-size:13px; }
.avatar { width:28px; height:28px; border-radius:50%; background:var(--side-2); border:1px solid rgba(255,255,255,.12); color:var(--side-ink); display:flex; align-items:center; justify-content:center; font-size:12px; }
.uname { flex:1; color:var(--side-ink); font-size:13px; }
.logout { color:var(--side-ink-2); text-decoration:none; font-size:12px; }
.logout:hover { color:#fff; }

/* ── 收起后的细边 ── */
.edge { display:none; width:16px; flex:0 0 16px; background:var(--side); color:var(--side-ink-2); align-items:center; justify-content:center; cursor:pointer; font-size:10px; }
.edge:hover { background:var(--side-2); color:#fff; }
.edge.show { display:flex; }

/* ── 主区 ── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.topbar { height:56px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:0 20px; }
.icon-btn { width:32px; height:32px; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); cursor:pointer; font-size:15px; color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center; transition:background-color .12s ease,border-color .12s ease; }
.icon-btn:hover { background:var(--surface-2); border-color:var(--line-2); }
.crumb { font-size:15px; font-weight:600; color:var(--ink); }
.crumb-note { font-size:12px; color:var(--ink-3); line-height:1.5; white-space:pre-line; overflow:hidden; max-height:48px; flex:1; min-width:0; }
.wp-tab { padding:5px 14px; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); font-size:13px; color:var(--ink-2); cursor:pointer; transition:background-color .12s ease,color .12s ease,border-color .12s ease; }
.wp-tab:hover { border-color:var(--line-2); color:var(--ink); }
.wp-tab.active { background:var(--accent-soft); color:#0a7a7a; border-color:rgba(19,194,194,.45); }

/* ── 查询区 ── */
.query-box { background:var(--surface); border-bottom:1px solid var(--line); padding:16px 20px; }
.form-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-group label { font-size:12px; color:var(--ink-2); font-weight:500; }
.form-group input, .form-group select { padding:8px 12px; border:1px solid var(--line-2); border-radius:var(--r-sm); font-size:14px; color:var(--ink); background:var(--surface); outline:none; min-width:160px; transition:border-color .12s ease,box-shadow .12s ease; }
.form-group input:focus, .form-group select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
/* ── 多选下拉（错误类型筛选）── */
.ms-wrap { position:relative; }
.ms-btn { padding:8px 12px; border:1px solid var(--line-2); border-radius:var(--r-sm); font-size:14px; background:var(--surface); cursor:pointer; width:170px; min-width:170px; max-width:170px; text-align:left; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ms-btn:hover { border-color:var(--accent); }
.ms-panel { display:none; position:absolute; top:100%; left:0; margin-top:6px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:0 8px 24px rgba(20,28,25,.10); padding:6px 0; min-width:190px; z-index:60; max-height:260px; overflow:auto; }
.ms-item { display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:13px; cursor:pointer; white-space:nowrap; }
.ms-item:hover { background:var(--surface-2); }
.ms-item input { min-width:auto !important; width:14px; height:14px; accent-color:var(--accent); }
.ms-all { border-bottom:1px solid var(--line); margin-bottom:4px; padding-bottom:9px; font-weight:600; }
.btn-query, .btn-export, .btn-save { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 20px; height:36px; border:1px solid transparent; border-radius:var(--r-sm); font-size:14px; cursor:pointer; transition:background-color .12s ease,border-color .12s ease,color .12s ease; }
/* 三个操作按钮各用一色：查询=主色蓝，导出=绿，更新/保存=橙（2026-11-11 hunter 定） */
.btn-query { background:var(--accent); color:#fff; }
.btn-query:hover { background:var(--accent-ink); }
.btn-export { background:var(--btn-export); color:#fff; }
.btn-export:hover { background:var(--btn-export-ink); }
.btn-save { background:var(--btn-save); color:#fff; }
.btn-save:hover { background:var(--btn-save-ink); }
.btn-query svg, .btn-export svg, .btn-save svg { width:15px; height:15px; stroke-width:1.6; flex:0 0 15px; }
.chip { padding:4px 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); cursor:pointer; font-size:13px; color:var(--ink-2); }
.chip.active { background:var(--accent-soft); color:#0a7a7a; border-color:rgba(19,194,194,.45); }
.loading { display:none; align-items:center; gap:8px; color:var(--ink-2); margin-top:8px; }
.spinner { width:14px; height:14px; border:2px solid var(--line-2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.error { color:var(--danger); padding:12px 16px; background:var(--danger-soft); border:1px solid rgba(178,51,43,.18); border-radius:var(--r-md); margin-top:12px; display:none; }

/* ── 数据区 ── */
.body { flex:1; overflow:hidden; padding:20px; display:flex; flex-direction:column; }
.table-wrap { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; flex:1; min-height:0; display:flex; flex-direction:column; }
.table-scroll { flex:1; overflow:auto; min-height:0; }
table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
thead { background:var(--surface-2); }
th { padding:10px 12px; text-align:left; font-weight:500; color:var(--ink-2); font-size:12.5px; border-bottom:1px solid var(--line-2); white-space:nowrap; position:sticky; top:0; background:var(--surface-2); z-index:2; }
td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); color:var(--ink); }
tbody tr:hover td { background:var(--surface-2); }
.empty { padding:48px 24px; text-align:center; color:var(--ink-3); }
.pagination { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--surface-2); border-top:1px solid var(--line); flex:0 0 auto; }
.page-btn { padding:5px 12px; border:1px solid var(--line-2); border-radius:var(--r-sm); background:var(--surface); cursor:pointer; font-size:13px; color:var(--ink); }
.page-btn:hover:not(:disabled) { background:var(--surface-3); }
.page-btn:disabled { opacity:.45; cursor:default; }
.col-text { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.col-wrap { max-width:560px; white-space:normal; word-break:break-word; line-height:1.5; vertical-align:top; }
.qmark { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; background:var(--surface-3); color:var(--ink-2); font-size:11px; font-weight:500; cursor:help; margin-left:6px; vertical-align:middle; }
.qmark:hover { background:var(--accent-soft); color:var(--accent-ink); }
.tip-pop { position:fixed; background:var(--ink); color:#fff; box-shadow:0 8px 24px rgba(20,28,25,.18); border-radius:var(--r-sm); padding:8px 10px; font-size:12px; z-index:99999; max-width:280px; line-height:1.6; }

/* ── 焦点与动效 ── */
:focus-visible { outline:none; box-shadow:var(--focus); }
button:focus-visible, input:focus-visible, select:focus-visible, .item:focus-visible, .page-btn:focus-visible { outline:none; box-shadow:var(--focus); }
@media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; } }

/* ── 窄屏：侧栏改浮层，查询区自动换行 ── */
@media (max-width: 1024px) {
  .sidebar { position:fixed; left:0; top:0; bottom:0; z-index:80; box-shadow:0 12px 32px rgba(20,28,25,.18); }
  .body { padding:16px; }
  .query-box { padding:12px 16px; }
}
@media (max-width: 720px) {
  .form-group input, .form-group select, .ms-btn { min-width:140px; }
  .crumb-note { display:none; }
  .body { padding:12px; }
}
/* 2026-11-13 工单详情弹窗 */
.tmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999}
.tmodal-box{background:#fff;border-radius:10px;max-width:820px;width:92%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.tmodal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #e6e9ee;font-weight:600;color:#2b4353}
.tmodal-head button{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:#666}
.tmodal-body{padding:14px 16px;overflow:auto}
.tmodal-body table.kv{width:100%;border-collapse:collapse}
.tmodal-body table.kv th{width:28%;text-align:left;color:#5a6b7b;font-weight:500;padding:6px 8px;vertical-align:top;border-bottom:1px solid #f0f2f5}
.tmodal-body table.kv td{padding:6px 8px;border-bottom:1px solid #f0f2f5;word-break:break-all}
.tmodal-body .sub{margin:14px 0 6px;font-weight:600;color:#2b4353}
.tmodal-foot{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px;border-top:1px solid #e6e9ee}
.tmodal-foot button{border:1px solid #cfd8e3;background:#fff;color:#2b4353;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer}
.tmodal-foot button:hover:not(:disabled){border-color:#10b0b0;color:#10b0b0}
.tmodal-foot #detail-nav-info{font-size:13px;color:#5a6b7b;min-width:64px;text-align:center}
/* 2026-11-13 彩色标签（工单类型/状态/数据状态/当前节点/紧急程度统一用这套） */
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600;line-height:19px;white-space:nowrap}
.tag--green{background:#F0FAF4;color:#1F8A5B;border:1px solid #C9EBD8}
.tag--blue{background:#EFF6FF;color:#2563A8;border:1px solid #CFE0F7}
.tag--orange{background:#FFF7EA;color:#A96B12;border:1px solid #F5DFB8}
.tag--red{background:#FFF0EF;color:#C0433A;border:1px solid #F6D3CF}
.tag--gray{background:#F0F2F8;color:#4B5A78;border:1px solid #DCE1EC}
.tag--purple{background:#F6F0FF;color:#6B4FBF;border:1px solid #E1D5F7}
.tag--teal{background:#ECF7F7;color:#1B7C7C;border:1px solid #C8E7E7}
.tag--brown{background:#F7EFE8;color:#7D5A44;border:1px solid #E4D2C6}
.tag--pink{background:#FBF0F6;color:#A8396F;border:1px solid #EED2E1}
tr.clickable-row{cursor:pointer}
tr.clickable-row:hover{background:#f2f7f7}
</style>
<script src="/shb/static/js/echarts.min.js"></script>
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="side-head"><svg class="brand-mark" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="3" width="2.5" height="14" rx="1.25" fill="currentColor"/><rect x="8.75" y="3" width="2.5" height="9" rx="1.25" fill="currentColor" opacity=".55"/><rect x="14.5" y="3" width="2.5" height="5" rx="1.25" fill="currentColor" opacity=".3"/></svg><span>SHB 数据</span></div>
    <nav class="menu" id="menu"></nav>
    <div class="side-foot">
      <span class="avatar">{{ (current_user or '?')[0] }}</span>
      <span class="uname">{{ current_user }}</span>
      <a href="/shb/logout" class="logout">退出</a>
    </div>
  </aside>
  <div id="edge" class="edge" title="展开侧边栏">▶</div>

  <main class="main">
    <div class="topbar">
      <button id="toggleBtn" class="icon-btn" title="收起侧边栏"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumb" id="pageTitle"></div>
      <div class="crumb-note" id="tabNote"></div>
      <div id="wpTabs" style="display:none;align-items:center;gap:6px">
        <button class="wp-tab active" data-mode="plan" onclick="setWeeklyMode('plan')">周计划</button>
        <button class="wp-tab" data-mode="summary" onclick="setWeeklyMode('summary')">周总结</button>
      </div>
    </div>

    <div class="query-box" id="query-box">
      <div class="form-row" id="form-row">
        <div class="form-group">
          <label>关键字</label>
          <input type="text" id="keyword" placeholder="工单编号 / 客户 / 字段值">
        </div>
        <div class="form-group">
          <label>创建时间从</label>
          <input type="date" id="date_begin">
        </div>
        <div class="form-group">
          <label>创建时间至</label>
          <input type="date" id="date_end">
        </div>
        <div class="form-group">
          <label>下拉选择</label>
          <select id="select_val">
            <option value="">全部</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="4">4</option>
          </select>
        </div>
        <button class="btn-query" onclick="doSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>查询</button>
        <button class="btn-export" id="export-btn" onclick="doExport()" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></svg>导出 CSV</button>
      </div>
      <div class="form-row" id="form-row-custom" style="display:none"></div>
      <div id="person-bar" style="display:none;margin-top:10px"></div>
      <div id="job-status" style="display:none;margin-top:10px;font-size:13px;color:#0d6efd"></div>
      <div id="audit-filter" style="display:none">
        <div class="form-row">
          <div class="form-group">
            <label>状态筛选</label>
            <select id="audit_status_filter" onchange="fetchAudit()">
              <option value="">全部</option>
              <option value="done">成功</option>
              <option value="failed">失败</option>
              <option value="verify_failed">回查不一致</option>
              <option value="executing">执行中</option>
            </select>
          </div>
          <button class="btn-query" onclick="fetchAudit()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>刷新日志</button>
        </div>
      </div>
      <div class="loading" id="loading"><div class="spinner"></div><span>查询中...</span></div>
      <div class="error" id="error"></div>
    </div>

    <div class="body">
      <div class="table-wrap">
        <div class="table-scroll" id="table-container"><div class="empty">输入条件后点击「查询」</div></div>
        <div class="pagination" id="pagination" style="display:none">
          <div><span id="page-info"></span></div>
          <div>
            <button class="page-btn" id="prev-btn" onclick="goPage(-1)">◀ 上一页</button>
            <button class="page-btn" id="next-btn" onclick="goPage(1)">下一页 ▶</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
let currentPage = 1, currentTab = 'station', totalPages = 1;
let isAuditTab = false;
let isSyncTab = false;
let isSyncLogTab = false;
let isIdTab = false;
let isUsersAccountTab = false;
let weeklyMode = 'plan';   // 周计划 / 周总结
let allTabs = {{ all_tabs | tojson }};
let userTabs = {{ tabs | tojson }};
let tabTitles = {{ tab_titles | tojson }};
let isAdmin = {{ 'true' if current_user == 'admin' else 'false' }};
if (userTabs && userTabs.length) currentTab = (userTabs.indexOf('bk_overview') >= 0 ? 'bk_overview' : userTabs[0]);

// ── 侧边栏菜单（分组）──
const AUDIT_KEY = '__audit__';
const GROUP_ORDER = ['概览', '工单在线查询', '工单备份', '客户备份', '在线报表', '本地报表', '系统'];
// 分组标题图标（只加在分组上，Tab 项不加）
const _svgIco = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const GROUP_ICONS = {

function groupOf(key) {
  // 2026-11-13：工单查询 / 问题工单归到独立分组「工单在线查询」
  if (key === 'ol:task-query' || key === 'ol:issue-tasks') return '工单在线查询';
  if (key.slice(0, 3) === 'ol:') return '在线报表';              // 在线报表（云端实时）
  if (key === 'bk_overview') return '概览';
  if (key.slice(0, 3) === 'bk:') return '工单备份';
  if (key.slice(0, 11) === 'bkent:paas:') return '工单备份';   // 问题工单
  if (key.slice(0, 6) === 'bkent:') return '客户备份';      // 客户/联系人/地址/设备
  if (key === 'fieldmap' || key === 'sync' || key === 'synclog') return '系统';  // 数据字典/同步中心/同步日志
  if (key === 'identity') return '系统';                    // 身份管理
  if (key === 'users-account') return '系统';               // 账号管理
  if (key === 'users') return '系统';                       // SHB用户
  if (key === 'station') return '客户备份';                 // 站点信息

const DEFAULT_COLLAPSED = {'概览': true, '工单在线查询': true, '工单备份': true, '客户备份': true, '在线报表': true, '本地报表': true, '系统': true};
const COLLAPSED = Object.assign({}, DEFAULT_COLLAPSED);   // 分组折叠状态（会话内记忆）
function renderMenu() {
  const menu = document.getElementById('menu');
  menu.innerHTML = '';
  const groups = {};
  userTabs.forEach(t => { const g = groupOf(t); (groups[g] = groups[g] || []).push(t); });
  if (isAdmin) (groups['系统'] = groups['系统'] || []).push(AUDIT_KEY);
  GROUP_ORDER.forEach(g => {
    const list = groups[g];
    if (!list || !list.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'group' + (COLLAPSED[g] ? ' collapsed' : '');
    const gt = document.createElement('div');
    gt.className = 'group-title';
    gt.innerHTML = '<span class="gname">' + (GROUP_ICONS[g] ? '<span class="gicon">' + GROUP_ICONS[g] + '</span>' : '') + esc(g) + '</span><span class="caret">▾</span>';
    gt.onclick = () => { COLLAPSED[g] = !COLLAPSED[g]; wrap.classList.toggle('collapsed'); };
    wrap.appendChild(gt);
    const box = document.createElement('div');
    box.className = 'group-items';
    list.forEach(t => {
      const it = document.createElement('div');
      const isSync = (t === 'sync'), isLog = (t === 'synclog'), isId = (t === 'identity'), isUA = (t === 'users-account');
      const active = (t === AUDIT_KEY) ? isAuditTab
                   : isSync ? isSyncTab
                   : isLog ? isSyncLogTab
                   : isId ? isIdTab
                   : isUA ? isUsersAccountTab
                   : (!isAuditTab && !isSyncTab && !isSyncLogTab && !isIdTab && !isUsersAccountTab && t === currentTab);
      it.className = 'item' + (active ? ' active' : '');
      it.textContent = (t === AUDIT_KEY) ? '操作日志' : (tabTitles[t] || t);
      it.onclick = () => (t === AUDIT_KEY ? switchToAudit()
                        : isSync ? switchToSync()
                        : isLog ? switchToSyncLog()
                        : isId ? switchToIdentity()
                        : isUA ? switchToUsersAccount()
                        : switchToTab(t));
      box.appendChild(it);
    });
    wrap.appendChild(box);
    menu.appendChild(wrap);
  });
  document.getElementById('pageTitle').textContent = isAuditTab ? '操作日志' : (isSyncTab ? '同步中心' : (isSyncLogTab ? '同步日志' : (isIdTab ? '身份管理' : (isUsersAccountTab ? '账号管理' : (tabTitles[currentTab] || currentTab)))));
  // 标题右侧说明（省屏幕空间）：目前仅项目进度（在线）有（2026-11-11）
  const _note = document.getElementById('tabNote');
  if (_note) {
    const _quiet = (isAuditTab || isSyncTab || isSyncLogTab || isIdTab || isUsersAccountTab);
    const _txt = _quiet ? '' : (TAB_NOTES[currentTab] || '');
    _note.textContent = _txt;
    _note.title = _txt;
    _note.style.color = (currentTab === 'ol:task-query' || currentTab === 'ol:issue-tasks') ? '#d63031' : '';
  }
  const _wp = document.getElementById('wpTabs');
  if (_wp) {
    const on = ((currentTab === 'weekly-plan' || currentTab === 'ol:weekly-plan') && !isAuditTab && !isSyncTab && !isSyncLogTab && !isIdTab && !isUsersAccountTab);
    _wp.style.display = on ? 'flex' : 'none';
    if (on) _wp.querySelectorAll('.wp-tab').forEach(b => b.classList.toggle('active', b.dataset.mode === weeklyMode));
  }
}

async function doSave() {
  const label = (currentTab === 'trip') ? '行程单（全员）'
              : (currentTab === 'workload') ? '服务人员工作量（当月工单动态）'
              : '项目进度（全量）';
  if (!confirm('将从 SHB 实时取数并存入本地库：' + label + '。可能需要几分钟，期间可继续查询。确定更新？')) return;
  const tab = currentTab;
  const params = new URLSearchParams({tab: tab});
  if (tab === 'trip') {
    const m = (document.getElementById('trip_month')||{}).value;
    if (m) params.set('month', m);
  } else if (tab === 'workload') {
    // 保存用的月份：取日期从的月份，没有就当前月
    const _wbv = (document.getElementById('wl_begin')||{value:''}).value;
    const m = _wbv ? _wbv.slice(0,7) : new Date().toISOString().slice(0,7);
    if (m) params.set('month', m);
  }
  try {
    const resp = await fetch('/shb/api/save?' + params.toString(), {method:'POST'});
    const d = await resp.json();
    if (!d.ok) { ACTIVE_JOBS[tab] = {text:'' + (d.error || '保存失败')}; updateJobBox(); return; }
    ACTIVE_JOBS[tab] = {id: d.job_id, text:'已开始保存，等待完成...'};
    updateJobBox();
    setSaveButtons(true);
    pollJob(d.job_id, tab);
  } catch(e) { ACTIVE_JOBS[tab] = {text:'网络错误：' + e.message}; updateJobBox(); }
}

async function pollJob(id, tab) {
  while (true) {
    await new Promise(r => setTimeout(r, 3000));
    let d;
    try { d = await (await fetch('/shb/api/job?id=' + id)).json(); }
    catch(e) { ACTIVE_JOBS[tab] = {id: id, text:'任务状态查询失败：' + e.message}; updateJobBox(); setSaveButtons(false); return; }
    if (!d.ok) { ACTIVE_JOBS[tab] = {id: id, text:'' + (d.error || '任务丢失')}; updateJobBox(); setSaveButtons(false); return; }
    if (d.status === 'ok') {
      ACTIVE_JOBS[tab] = {id: id, text:'保存完成' + (d.output ? '：' + d.output.replace(/\n/g,' | ') : '')};
      updateJobBox(); setSaveButtons(false);
      if (currentTab === tab) doSearch();
      return;
    }
    if (d.status === 'failed') {
      ACTIVE_JOBS[tab] = {id: id, text:'保存失败' + (d.error ? '：' + d.error : '')};
      updateJobBox(); setSaveButtons(false);
      return;
    }
    ACTIVE_JOBS[tab] = {id: id, text:'正在保存（' + (d.status === 'queued' ? '排队中' : '运行中') + '）...'};
    updateJobBox();
  }
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  const btn = box.querySelector('.ms-btn');

// 点击“?”弹出提示（2026-11-10）
let _tipEl = null;
function showTip(ev, el, text) {
  if (ev) ev.stopPropagation();
  if (_tipEl) { _tipEl.remove(); _tipEl = null; }
  const t = document.createElement('div');
  t.className = 'tip-pop';
  t.textContent = text;
  document.body.appendChild(t);
  const r = el.getBoundingClientRect();
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  t.style.top = (r.bottom + 6 + h > window.innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px';
  _tipEl = t;
  const close = (e) => {
    if (e && (e.target === el || t.contains(e.target))) return;
    t.remove(); _tipEl = null;
    document.removeEventListener('click', close);
  };
  setTimeout(() => document.addEventListener('click', close), 0);
}

// ══ 在线报表（云端实时）：提交后台任务 → 轮询进度 → 渲染 ══
let LAST_ONLINE = {};   // tab -> 最近一次在线查询结果（导出用）

function onlineParams() {
  const cfg = ONLINE_FORMS[currentTab] || [];
  const p = {};
  cfg.forEach(f => {
    if (f.type === 'multiselect') {
      const _vals = _msValues(f.id);
      if (_vals.length) p[f.param] = _vals.join(',');
      return;
    }
    const el = document.getElementById(f.id);
    if (!el) return;
    if (f.type === 'checkbox') { if (el.checked) p[f.param] = '1'; return; }
    const v = (el.value || '').trim();
    if (v) p[f.param] = v;
  });
  if (currentTab === 'ol:weekly-plan') p.mode = weeklyMode || 'plan';
  if (currentTab === 'ol:task-query') p.types = _tqType || '__all__';
  return p;
}

async function fetchOnline() {
  const loading = document.getElementById('loading'), error = document.getElementById('error'),
        tc = document.getElementById('table-container'), pg = document.getElementById('pagination');
  const box = document.getElementById('job-status');
  loading.style.display = 'flex'; error.style.display = 'none'; tc.innerHTML = '';
  pg.style.display = 'none';
  if (box) { box.style.display = ''; box.textContent = '正在提交云端查询…'; }
  try {
    const resp = await fetch('/shb/api/online-query?tab=' + encodeURIComponent(currentTab), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(onlineParams())
    });
    const d0 = await resp.json();
    if (!d0.ok) throw new Error(d0.error || '提交失败');
    if (d0.cached && d0.result) {
      loading.style.display = 'none'; if (box) box.style.display = 'none';
      LAST_ONLINE[currentTab] = d0.result; renderResultData(d0.result); return;
    }
    const jobId = d0.job_id;
    while (true) {
      await new Promise(r => setTimeout(r, 1500));
      let d;
      try { d = await (await fetch('/shb/api/job?id=' + jobId)).json(); }
      catch(e) { throw new Error('任务状态查询失败：' + e.message); }
      if (!d.ok) throw new Error(d.error || '任务丢失');
      if (box) box.textContent = '' + (d.progress || '查询中') + '…';
      if (d.status === 'ok') {
        loading.style.display = 'none'; if (box) box.style.display = 'none';
        LAST_ONLINE[currentTab] = d.result;
        renderResultData(d.result);
        return;
      }
      if (d.status === 'failed') throw new Error(d.error || '云端查询失败');
    }
  } catch(e) {
    loading.style.display = 'none';
    if (box) box.style.display = 'none';
    error.textContent = '云端查询失败：' + e.message;
    error.style.display = 'block';
  }
}

async function openTaskDetail(el) {
  const id = (el && el.getAttribute) ? String(el.getAttribute('data-id')) : String(el || '');

  const body = document.getElementById('task-modal-body');

  try {
    const _url = _isIssue ? '/shb/api/online/issue-detail?id=' : '/shb/api/online/task-detail?id=';
    const d = await (await fetch(_url + encodeURIComponent(id))).json();
    if (!d.ok) throw new Error(d.error || '加载失败');

      // 问题工单：分区展示全量中文信息（2026-11-13 hunter 定）
      const dt = d.detail || {};
      if (ttl && dt.title) ttl.textContent = dt.title + ' · 问题工单详情';
      const secs = dt.sections || [];
      if (!secs.length) { body.innerHTML = '<div class="empty">无数据</div>'; return; }
      let h2 = '';
      secs.forEach(sec => {
        h2 += '<div class="sub">' + esc(sec.name) + '</div><table class="kv">';
        (sec.items || []).forEach(it => {
          let v = esc(it.value == null ? '' : String(it.value)).replace(/\n/g, '<br>');

            if (u && u.url) v += '<br><a href="' + esc(u.url) + '" target="_blank" rel="noopener">' + esc(u.name || '附件') + '</a>';
          });
          h2 += '<tr><th>' + esc(it.label) + '</th><td>' + v + '</td></tr>';
        });

      });

    Object.keys(b).forEach(k => { h += '<tr><th>' + esc(k) + '</th><td>' + esc(b[k]) + '</td></tr>'; });

window._wrCharts = [];

function _wrIso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function setWorkRange(kind) {
  const n = new Date();
  let b, e;
  if (kind === 'd7') { b = new Date(n); b.setDate(n.getDate() - 6); e = new Date(n); }
  else if (kind === 'month') { b = new Date(n.getFullYear(), n.getMonth(), 1); e = new Date(n.getFullYear(), n.getMonth() + 1, 0); }
  else { b = new Date(n); b.setDate(n.getDate() - ((n.getDay() + 6) % 7)); e = new Date(b); e.setDate(b.getDate() + 6); }
  const eb = document.getElementById('olwr_begin'), ee = document.getElementById('olwr_end');
  if (eb) eb.value = _wrIso(b);
  if (ee) ee.value = _wrIso(e);
  doSearch();
}

// 数值化：普通数字原样返回；"1天2小时35分20秒" → 小时数（画图用，tooltip 显原文）
function _wrNum(v) {
  const s = String(v == null ? '' : v).replace(/,/g, '').trim();
  if (!s) return 0;
  if (/^-?[\d.]+$/.test(s)) return parseFloat(s);
  let h = 0, m;
  if ((m = /(-?[\d.]+)\s*天/.exec(s))) h += parseFloat(m[1]) * 24;
  if ((m = /(-?[\d.]+)\s*小时/.exec(s))) h += parseFloat(m[1]);
  if ((m = /(-?[\d.]+)\s*分/.exec(s))) h += parseFloat(m[1]) / 60;
  if ((m = /(-?[\d.]+)\s*秒/.exec(s))) h += parseFloat(m[1]) / 3600;
  return Math.round(h * 100) / 100;
}

function _wrSplit(block) {
  let dim = null;
  const vals = [];
  (block.data || []).forEach(function (s) {
    if (s.type === 'dimension') { if (!dim) dim = s; } else vals.push(s);
  });
  return {dim: dim, vals: vals};
}

const WR_PALETTE = ['#1890ff', '#52c41a', '#faad14', '#722ed1', '#13c2c2', '#eb2f96', '#fa8c16', '#2f54eb'];

function _wrLoadMap() {
  if (window._wrMapReady) return Promise.resolve();
  return fetch('/shb/static/js/china.json').then(r => r.json()).then(j => {
    echarts.registerMap('china', j);
    // 顺手记下各省中心点，供气泡定位（2026-11-16：地图改为可缩放 + 气泡显数）
    const centers = {};
    (j.features || []).forEach(f => {
      const p = f.properties || {};
      if (p.name && p.center && p.center.length === 2) centers[p.name] = p.center;
    });
    window._wrCenters = centers;
    window._wrMapReady = true;
  }).catch(() => {});
}

// 省份名归一化匹配（数据里可能省/市/自治区 写法略有差异）
function _wrCenterOf(name) {
  const c = window._wrCenters || {};
  if (c[name]) return c[name];
  const short = String(name || '').replace(/(省|市|自治区|特别行政区|回族|维吾尔|壮族|自治州)/g, '');
  for (const k in c) {
    if (k === name) return c[k];
    if (k.replace(/(省|市|自治区|特别行政区|回族|维吾尔|壮族|自治州)/g, '') === short) return c[k];
  }
  return null;
}

// 工单管理导出：把 blocks 按页面顺序转成 AOA（一行 4 张卡片；大图表各占一段）
function _wrBuildAoa(blocks) {
  const aoa = [];
  let smallBuf = [];
  const flushSmall = () => {
    while (smallBuf.length) {
      const line = [];
      smallBuf.splice(0, 4).forEach(c => { line.push(c.name, c.value); });
      aoa.push(line);
    }
    smallBuf = [];
    if (aoa.length && aoa[aoa.length - 1].length) aoa.push([]);
  };
  blocks.forEach(b => {
    if (b.isSection) { flushSmall(); aoa.push([b.chartName]); return; }
    const sp = _wrSplit(b);
    if (b.chartType === 'card' || b.chartType === 'gauge') {
      const v = (sp.vals[0] && sp.vals[0].data && sp.vals[0].data[0])
        ? String(sp.vals[0].data[0].displayName == null ? '' : sp.vals[0].data[0].displayName) : '';
      smallBuf.push({name: b.chartName, value: v});
      return;
    }
    flushSmall();
    aoa.push([b.chartName]);
    const cols = (sp.dim ? [sp.dim] : []).concat(sp.vals);
    const n = sp.dim ? ((sp.dim.data || []).length) : (((sp.vals[0] || {}).data || []).length);
    if (!n) { aoa.push(['（暂无数据）']); aoa.push([]); return; }
    aoa.push(cols.map(c => c.name));
    for (let i = 0; i < n; i++) {
      aoa.push(cols.map(c => {
        const cell2 = c.data && c.data[i];
        return cell2 ? String(cell2.displayName == null ? '' : cell2.displayName) : '';
      }));
    }
    aoa.push([]);
  });
  flushSmall();
  return aoa;
}

function _wrTableHtml(block) {
  const sp = _wrSplit(block);
  const dim = sp.dim;
  const rows = (dim && dim.data) || [];
  if (!rows.length) return '<div class="empty" style="padding:18px">暂无数据</div>';
  const cols = (dim ? [dim] : []).concat(sp.vals);
  let h = '<table><thead><tr>' + cols.map(c => '<th>' + esc(c.name) + '</th>').join('') + '</tr></thead><tbody>';
  rows.forEach((r, i) => {
    h += '<tr>' + cols.map(c => {
      const cellV = (c.data && c.data[i]) ? (c.data[i].displayName == null ? '' : c.data[i].displayName) : '';
      return '<td>' + esc(String(cellV)) + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</tbody></table>';
}

function _wrInitChart(block) {
  const el = document.getElementById('wrc_' + block.chartOrder);
  if (!el || typeof echarts === 'undefined') return;
  const sp = _wrSplit(block);
  const dim = sp.dim;
  const cats = ((dim && dim.data) || []).map(x => x.displayName);
  const legend = sp.vals.map(v => v.name);
  const t = block.chartType;
  let opt = null;

  const base = {
    color: WR_PALETTE,
    tooltip: {trigger: t === 'ring-pie' ? 'item' : 'axis', confine: true},
    legend: {top: 0, type: 'scroll', textStyle: {fontSize: 12}},
    grid: {left: 50, right: 24, top: 42, bottom: 34, containLabel: true}
  };

  if (t === 'line' || t === 'bar' || t === 'bar-line') {
    const series = sp.vals.map((v, i) => ({
      name: v.name,
      type: (t === 'bar-line' && i > 0) ? 'line' : (t === 'line' ? 'line' : 'bar'),
      smooth: true,
      symbolSize: 5,
      barMaxWidth: 26,
      data: ((v.data) || []).map(x => _wrNum(x.displayName))
    }));
    opt = Object.assign({}, base, {
      xAxis: {type: 'category', data: cats, axisLabel: {fontSize: 11, interval: cats.length > 20 ? 'auto' : 0, rotate: cats.length > 14 ? 40 : 0}},
      yAxis: {type: 'value', axisLabel: {fontSize: 11}},
      series: series
    });
  } else if (t === 'bar-horizontal') {
    const series = sp.vals.map(v => ({name: v.name, type: 'bar', barMaxWidth: 20, data: ((v.data) || []).map(x => _wrNum(x.displayName))}));
    opt = Object.assign({}, base, {
      xAxis: {type: 'value', axisLabel: {fontSize: 11}},
      yAxis: {type: 'category', data: cats, axisLabel: {fontSize: 11}},
      series: series
    });
  } else if (t === 'ring-pie') {
    const v = sp.vals[0] || {data: []};
    const dd = (v.data || []).map((x, i) => ({name: cats[i] || x.displayName, value: _wrNum(x.displayName)}));
    opt = {
      color: WR_PALETTE,
      tooltip: {trigger: 'item', formatter: '{b}: {c} ({d}%)'},
      legend: {type: 'scroll', orient: 'horizontal', top: 0, textStyle: {fontSize: 11}},
      series: [{type: 'pie', radius: ['42%', '68%'], center: ['50%', '56%'], avoidLabelOverlap: true,
                label: {fontSize: 10, formatter: '{b}\n{c}'}, data: dd}]
    };
  } else if (t === 'map') {
    const v = sp.vals[0] || {data: []};
    const barges = [];
    ((v.data) || []).forEach((x, i) => {
      const nm = cats[i] || x.displayName;
      const cnt = _wrNum(x.displayName);
      const ct = _wrCenterOf(nm);
      if (ct) barges.push({name: nm, value: [ct[0], ct[1], cnt]});
    });
    const maxN = Math.max.apply(null, barges.map(b => b.value[2]).concat([1]));
    opt = {
      tooltip: {trigger: 'item', formatter: p => p.name + '：' + (p.value && p.value[2] != null ? p.value[2] : 0)},
      geo: {
        map: 'china', roam: true, scaleLimit: {min: 0.8, max: 12},
        zoom: 1.15, top: 10, bottom: 10,
        itemStyle: {areaColor: '#eaf4ff', borderColor: '#b6d9f7', borderWidth: 0.8},
        emphasis: {itemStyle: {areaColor: '#cfe7ff'}, label: {show: false}},
        select: {disabled: true}
      },
      series: [{
        type: 'scatter', coordinateSystem: 'geo',
        symbolSize: val => 14 + Math.sqrt(val[2] || 0) / Math.sqrt(maxN) * 26,
        itemStyle: {color: '#1890ff', opacity: 0.82, borderColor: '#fff', borderWidth: 1},
        label: {show: true, position: 'inside', formatter: p => p.value[2], color: '#fff', fontSize: 11, fontWeight: 600},
        emphasis: {scale: 1.15},
        data: barges
      }]
    };
  } else if (t === 'gauge') {
    const v = (sp.vals[0] && sp.vals[0].data && sp.vals[0].data[0]) ? _wrNum(sp.vals[0].data[0].displayName) : 0;
    opt = {
      series: [{type: 'gauge', min: 0, max: 100, radius: '85%',
                axisLine: {lineStyle: {width: 10, color: [[0.6, '#ff7875'], [0.85, '#ffc069'], [1, '#52c41a']]}},
                pointer: {width: 4}, detail: {fontSize: 16, formatter: '{value}'},
                data: [{value: v}]}]
    };
  }
  if (!opt) { el.innerHTML = '<div class="empty" style="padding:18px">暂无数据</div>'; return; }
  const ch = echarts.init(el);
  ch.setOption(opt);
  window._wrCharts.push(ch);
}

// 本地业务结果：前端生成 Excel（与 u8-web 同方案，SheetJS，服务端零依赖）
async function fetchAllRows(tab, baseParams) {
  const rows = []; let cols = null, page = 1;
  while (true) {
    const p = new URLSearchParams(baseParams);
    p.set('tab', tab); p.set('page', page); p.set('page_size', 200);
    const d = await (await fetch('/shb/api/search?' + p.toString())).json();
    if (!d.ok) throw new Error(d.error || '查询失败');
    cols = (d.columns && d.columns.length) ? d.columns : cols;
    rows.push(...(d.rows || []));
    if (page >= (d.total_pages || 1)) break;
    page++;
  }
  return { cols, rows };
}

function _sheetName(nm, used) {
  let base = String(nm || '未署名').replace(/[:\\\/?*\[\]]/g, '_').slice(0, 31) || '未署名';
  let name = base, k = 2;
  while (used.has(name)) { const suf = '~' + (k++); name = base.slice(0, 31 - suf.length) + suf; }
  used.add(name);
  return name;
}

let _xlsxPromise = null;
function ensureXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (_xlsxPromise) return _xlsxPromise;
  _xlsxPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/shb/static/xlsx.full.min.js';
    s.onload = () => window.XLSX ? resolve() : reject(new Error('导出组件加载后不可用'));
    s.onerror = () => { _xlsxPromise = null; reject(new Error('导出组件加载失败（本地文件缺失）')); };
    document.head.appendChild(s);
  });
  return _xlsxPromise;
}

async function doExportExcel(baseParams) {
  const box = document.getElementById('job-status');
  box.style.display = '';
  try {
    if (typeof XLSX === 'undefined') {
      box.textContent = '正在加载导出组件...';
      await ensureXlsx();
    }
    box.textContent = '正在生成 Excel...';
    const tab = currentTab;
    // 周计划：一个文件两个 sheet，网格版式（行=负责人，列=周一~周日），与页面一致
    if (tab === 'weekly-plan') {
      box.textContent = '正在生成周计划 / 周总结…';
      const fetchMode = async (mode) => {
        const q = new URLSearchParams(baseParams);
        q.set('tab', 'weekly-plan'); q.set('mode', mode);
        q.set('page', '1'); q.set('page_size', '500');
        const d = await (await fetch('/shb/api/search?' + q.toString())).json();
        if (!d.ok) throw new Error(d.error || '查询失败');
        return d;
      };
      const [pl, sm] = await Promise.all([fetchMode('plan'), fetchMode('summary')]);
      const wb0 = XLSX.utils.book_new();
      const addGrid = (name, data) => {
        const rawCols = data.columns || [];
        const aoa = [rawCols.map(_cellText)];
        (data.rows || []).forEach(r => aoa.push(rawCols.map(c => _cellText(r[c]))));
        XLSX.utils.book_append_sheet(wb0, XLSX.utils.aoa_to_sheet(aoa), name);
      };
      addGrid('周计划', pl);
      addGrid('周总结', sm);
      const _ws = String(pl.week_start || '').replace(/-/g, '');
      const _we = String(pl.week_end || '').replace(/-/g, '');
      const _fn = '周计划_' + _ws + '-' + _we + '.xlsx';
      XLSX.writeFile(wb0, _fn);
      box.textContent = '已生成 ' + _fn + '（周计划 ' + (pl.rows || []).length + ' 人 / 周总结 ' + (sm.rows || []).length + ' 人）';
      return;
    }
    const { cols, rows } = await fetchAllRows(tab, tab === 'trip' ? new URLSearchParams() : baseParams);
    if (!rows.length) { box.textContent = '当前条件下没有数据可导出'; return; }
    const wb = XLSX.utils.book_new();
    if (tab === 'trip') {
      const byName = {};
      rows.forEach(r => { const n = r['姓名'] || '未署名'; (byName[n] = byName[n] || []).push(r); });
      const used = new Set();
      Object.keys(byName).forEach(nm => {
        const rs = byName[nm];
        const aoa = [cols];
        rs.forEach((r, i) => aoa.push(cols.map(c => (c === '序号' ? i + 1 : r[c]))));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), _sheetName(nm, used));
      });
    } else {
      const aoa = [cols];
      rows.forEach(r => aoa.push(cols.map(c => r[c])));
      const _sheet = tab === 'fieldmap' ? '数据字典'
                   : (tab === 'workload' ? '服务人员工作量'
                   : (tab === 'maintain-progress' ? '保运进度'
                   : (tab === 'accept-progress' ? '验收进度'
                   : '项目进度')));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), _sheet);
    }
    const d = new Date();
    const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const _base = tab === 'fieldmap' ? '数据字典_'
                : (tab === 'trip' ? '行程单_'
                : (tab === 'workload' ? '服务人员工作量_'
                : (tab === 'maintain-progress' ? '保运进度_'
                : (tab === 'accept-progress' ? '验收进度_'
                : '项目进度_'))));
    const fname = _base + stamp + '.xlsx';
    XLSX.writeFile(wb, fname);
    box.textContent = '已生成 ' + fname + '（' + rows.length + ' 行' + (tab === 'trip' ? '，按人分页签' : '') + '）';
  } catch (e) {
    box.textContent = '导出失败：' + e.message;
  }
}

// 在线报表：直接用最近一次查询结果生成 Excel（周计划：周计划+周总结 两个 sheet）
function _cellText(v) {
  let s = String(v == null ? '' : v);
  s = s.replace(/<br\s*\/?>/gi, '\n');
  s = s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
  return s;
}

function _appendSheet(wb, name, data) {
  const cols = (data && data.columns) || [];
  const aoa = [cols.map(_cellText)];
  ((data && data.rows) || []).forEach(r => aoa.push(cols.map(c => _cellText(r[c]))));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
}

async function fetchWeeklyResult(week, mode, keyword) {
  const body = {week_start: week, mode: mode};
  if (keyword) body.keyword = keyword;      // 按当前筛选导出（2026-11-10）
  const resp = await fetch('/shb/api/online-query?tab=ol:weekly-plan', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const d0 = await resp.json();
  if (!d0.ok) throw new Error(d0.error || '提交失败');
  if (d0.cached && d0.result) return d0.result;
  const jobId = d0.job_id;
  const box = document.getElementById('job-status');
  while (true) {
    await new Promise(r => setTimeout(r, 1500));
    let d;
    try { d = await (await fetch('/shb/api/job?id=' + jobId)).json(); }
    catch (e) { throw new Error('任务状态查询失败：' + e.message); }
    if (!d.ok) throw new Error(d.error || '任务丢失');
    if (box && d.status !== 'ok') {
      box.style.display = '';
      box.textContent = '' + (mode === 'plan' ? '周计划' : '周总结') + '：' + (d.progress || '查询中') + '…';
    }
    if (d.status === 'ok') return d.result;
    if (d.status === 'failed') throw new Error(d.error || '查询失败');
  }
}

    Object.assign(map, d.map || {});
  }
  // 列顺序按首次出现，编号固定第一列
  const colOrder = [];
  data.rows.forEach(r => (map[r.__id] || []).forEach(it => { if (colOrder.indexOf(it.label) < 0) colOrder.push(it.label); }));
  const _ni = colOrder.indexOf('编号');
  if (_ni >= 0) colOrder.splice(_ni, 1);
  colOrder.unshift('编号');
  const aoa = [colOrder.slice()];
  data.rows.forEach(r => {
    const items = map[r.__id] || [];
    aoa.push(colOrder.map(l => { const it = items.find(x => x.label === l); return it ? it.value : ''; }));
  });
  const wsAll = XLSX.utils.aoa_to_sheet(aoa);
  // 2026-11-13 16:08 hunter 定：不单独建「附件」sheet，直接在「全部字段」里给附件单元格加链接
  // 多张图时链接指向第一张，其余文件名+链接写进单元格批注（悬停可见）
  data.rows.forEach((r, ri) => {
    (map[r.__id] || []).forEach(it => {
      const urls = (it.urls || []).filter(u => u && u.url);
      if (!urls.length) return;
      const ci = colOrder.indexOf(it.label);
      if (ci < 0) return;
      const cell = wsAll[XLSX.utils.encode_cell({r: ri + 1, c: ci})];
      if (!cell) return;
      cell.h = urls[0].url;
      cell.l = {Target: urls[0].url};
      if (urls.length > 1) {
        cell.c = [{a: 'shb-web', t: urls.map(u => (u.name || '附件') + '：' + u.url).join('\n')}];
      }
    });
  });
  XLSX.utils.book_append_sheet(wb, wsAll, '全部字段');
}

async function doExportOnline() {
  const box = document.getElementById('job-status');
  const base = {'ol:trip':'行程单（在线）','ol:workload':'服务人员工作量（在线）',
                'ol:progress2':'项目进度（在线）','ol:debug-progress':'调试进度（在线）',

                'ol:issue-tasks':'问题工单',

  try {

        return;
      }
      const ws = XLSX.utils.aoa_to_sheet(_wrBuildAoa(data.blocks));
      ws['!cols'] = [{wch: 24}, {wch: 16}, {wch: 24}, {wch: 16},
                     {wch: 24}, {wch: 16}, {wch: 24}, {wch: 16}];
      XLSX.utils.book_append_sheet(wb, ws, '工单管理');
      rowsHint = data.blocks.length;
    } else if (currentTab === 'ol:weekly-plan') {
      const week = ((document.getElementById('olw_week') || {}).value) || _isoDate(new Date());
      const kw = ((document.getElementById('olw_person') || {}).value || '').trim();
      if (box) { box.style.display = ''; box.textContent = '正在生成周计划 / 周总结…'; }
      const [p, s] = await Promise.all([fetchWeeklyResult(week, 'plan', kw),
                                        fetchWeeklyResult(week, 'summary', kw)]);
      _appendSheet(wb, '周计划', p);
      _appendSheet(wb, '周总结', s);
      LAST_ONLINE[currentTab + '|plan'] = p;
      LAST_ONLINE[currentTab + '|summary'] = s;
      rowsHint = ((p.rows || []).length) + ((s.rows || []).length);
    } else {
      const data = LAST_ONLINE[currentTab];
      if (!data || !data.rows || !data.rows.length) {
        if (box) { box.style.display = ''; box.textContent = '请先查询出结果再导出'; }
        return;
      }
      const cols = data.columns || [];
      if (currentTab === 'ol:trip') {
        const byName = {};
        data.rows.forEach(r => { const n = r['姓名'] || '未署名'; (byName[n] = byName[n] || []).push(r); });
        const used = new Set();
        Object.keys(byName).forEach(nm => {
          const rs = byName[nm];
          const aoa = [cols.map(_cellText)];
          rs.forEach((r, i) => aoa.push(cols.map(c => (c === '序号' ? i + 1 : _cellText(r[c])))));
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), _sheetName(nm, used));
        });
      } else if (currentTab === 'ol:issue-tasks') {
        // 问题工单：列表 sheet 去掉「客户」列（2026-11-13 hunter 定）
        _appendSheet(wb, base.replace('（在线）', ''),
                     {columns: cols.filter(c => c !== '客户'), rows: data.rows});
        // 2026-11-13 15:29 hunter 定：再加「全部字段」sheet（详情页除客户外所有字段）+「附件」sheet（图片链接）
        await _appendIssueFullSheets(wb, data, box);
      } else {
        _appendSheet(wb, base.replace('（在线）', ''), data);
      }
      rowsHint = data.rows.length;
    }

    const d = new Date();
    const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const fname = base + '_' + stamp + '.xlsx';
    XLSX.writeFile(wb, fname);
    if (box) { box.style.display = ''; box.textContent = '已生成 ' + fname + '（' + rowsHint + ' 行）'; }
  } catch (e) {
    if (box) { box.style.display = ''; box.textContent = '导出失败：' + e.message; }
  }
}

// 日志 Tab（仅 admin）
function renderAuditTable(data) {
  const tc = document.getElementById('table-container'), pg = document.getElementById('pagination');
  if (!data.rows.length) { tc.innerHTML = '<div class="empty">暂无日志</div>'; pg.style.display = 'none'; return; }
  const cols = ['ts','operator','domain','operation','detail','status'];
  const colLabels = {ts:'时间', operator:'操作人', domain:'来源', operation:'操作', detail:'目标/字段', status:'状态'};
  // 2026-11-13 15:07 hunter：操作日志要给人看 —— 操作/状态/页签/模板全部翻译成中文
  const _WEB_OP = {'web:search':'查询','web:online_query':'在线查询','web:export':'导出 CSV',
                   'web:export_excel':'导出 Excel','web:save':'保存到本地库','web:sync':'同步',
                   'web:login':'登录','web:logout':'登出'};
  const _STATUS_CN = {done:'成功', failed:'失败', executing:'执行中', verify_failed:'回查不一致', cancelled:'已取消'};
  const _TPL_CN = {'d5f0af73':'工程工单','aa7f2af4':'预调试工单','f6690742':'调试工单','8024da3e':'验收工单',
                   '1d0a8205':'保运工单','4993cd38':'售后工单','c33632ed':'日常工单','25daa54e':'改造工单',
                   'd8c34f70':'问题工单'};
  function _opCn(row) {
    const a = row.action || '', op = (row.operation || '');
    if (_WEB_OP[a]) return _WEB_OP[a];
    if (a === 'write') {
      const d = row.domain || '', o = op.toLowerCase();
      if (d === 'task') {
        if (o.includes('create')) return '创建工单';
        if (o.includes('alloc')) return '分配工单';
        if (o.includes('update')) return '更新工单';
        return '工单操作';
      }
      if (d === 'paas') return '表单操作';
      if (d === 'customer') return '客户操作';
      return (d ? d + ' ' : '') + (op || '写操作');
    }
    return a || op || '';
  }
  // 2026-11-13：把后端解析好的 _target/_fields 渲染成可读摘要（工单 ID / 表单 bizId / 改动字段）
  function _auditDetail(row) {
    const parts = [];
    if (row.tab) parts.push('页签 ' + (tabTitles[row.tab] || row.tab));
    const t = row._target || {};
    if (t.task_id) parts.push('工单 ' + String(t.task_id).slice(0, 14));
    if (t.bizId) parts.push('表单 ' + String(t.bizId).slice(0, 14));
    if (t.template_id) parts.push('模板 ' + (_TPL_CN[String(t.template_id).slice(0, 8)] || String(t.template_id).slice(0, 8)));
    if (t.customer) parts.push('客户 ' + String(t.customer).slice(0, 12));
    const f = row._fields;
    if (f && typeof f === 'object') {
      const ks = Object.keys(f);
      const items = ks.slice(0, 3).map(k => {
        const x = f[k] || {};
        let v = x.value !== undefined ? x.value : (x.label || '');
        if (typeof v === 'object') v = JSON.stringify(v);
        return (x.display_name || k) + '=' + String(v).slice(0, 24);
      });
      if (items.length) parts.push(items.join('；') + (ks.length > 3 ? ' …等' + ks.length + '项' : ''));
    }
    if (!parts.length && row.target) parts.push(String(row.target).slice(0, 40));
    return parts.join(' ｜ ');
  }
  // 2026-11-13：shb-web 自身操作（action_source=shb-web）没有 domain/operation，回退显示
  const _cell = (r, c) => (r[c] != null && r[c] !== '') ? r[c]
    : (c === 'domain' ? (r.action_source || '') : (c === 'operation' ? (r.action || '') : ''));
  let html = '<table><thead><tr>' + cols.map(c => '<th>'+colLabels[c]+'</th>').join('') + '</tr></thead><tbody>';
  data.rows.forEach(row => {
    html += '<tr>' + cols.map(c => {
      let v = (c === 'detail') ? _auditDetail(row) : (_cell(row, c) || '');
      if (c === 'ts') v = v.replace('T',' ').substring(0,19);
      if (c === 'operation') v = _opCn(row) || v;
      if (c === 'status') {
        const _raw = String(v);
        const _cn = _STATUS_CN[_raw] || _raw;
        const color = _raw==='failed'?'#d63031':_raw==='verify_failed'?'#e17055':_raw==='done'?'#00b894':'#636e72';
        v = '<span style="color:'+color+';font-weight:600">'+_cn+'</span>';
      }
      return '<td title="'+JSON.stringify(row).substring(0,100)+'" class="col-text">'+v+'</td>';
    }).join('') + '</tr>';
  });
  html += '</tbody></table>';
  tc.innerHTML = html;
  document.getElementById('page-info').textContent = '第 '+currentPage+'/'+data.total_pages+' 页，共 '+data.total+' 条';
  document.getElementById('prev-btn').disabled = currentPage <= 1;
  document.getElementById('next-btn').disabled = currentPage >= data.total_pages;
  pg.style.display = 'flex';
}

function renderSyncTable(tasks, sched) {
  const tc = document.getElementById('table-container');
  const th = ['任务','说明','参数','更新哪块数据','上次','操作'];
  let html = '<table><thead><tr>'+th.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  tasks.forEach(t => {
    let param = '—';
    if (t.param === 'mode') {
      param = '<select id="sync_mode_'+t.key+'"><option value="incr">增量</option><option value="full">全量</option></select>';
    } else if (t.param === 'month') {
      param = '<input type="month" id="sync_month_'+t.key+'" value="'+new Date().toISOString().slice(0,7)+'">';
    }
    const last = t.last ? (esc(t.last.time||'')+' <span style="color:'+(t.last.status==='ok'?'#00b894':'#d63031')+';font-weight:600">'+esc(t.last.status||'')+'</span>') : '<span style="color:#999">从未</span>';
    const btn = t.running
      ? '<span style="color:#0d6efd">运行中…</span>'
      : '<button class="btn-save" onclick="runSync(\''+t.key+'\')">▶ 运行</button>';
    html += '<tr><td><b>'+esc(t.title)+'</b></td><td class="col-text">'+esc(t.desc)+'</td><td>'+param+
            '</td><td class="col-text">'+esc(t.writes)+'</td><td class="col-text">'+last+'</td><td>'+btn+'</td></tr>';
  });
  html += '</tbody></table>';
  // 2026-11-12 hunter 定：表格下方补定时备份说明（时间从 cron 表达式推导，下次时间取 cron 实际值）
  const _hhmm = (e) => {
    const p = (e || '').trim().split(/\s+/);
    return (p.length >= 2) ? (String(p[1]).padStart(2,'0') + ':' + String(p[0]).padStart(2,'0')) : '';
  };
  const _wt = _hhmm(sched && sched.weekly && sched.weekly.expr) || '06:00';
  const _qt = _hhmm(sched && sched.quarterly && sched.quarterly.expr) || '01:00';
  const _wn = (sched && sched.weekly && sched.weekly.next) || '';
  const _qn = (sched && sched.quarterly && sched.quarterly.next) || '';
  html += '<div style="margin-top:14px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:12.5px;line-height:1.9;color:#d63031">'
        + '<div style="font-weight:600;color:#d63031;margin-bottom:4px">自动备份：</div>'
        + '<div>1、每周日 ' + _wt + ' 执行「工单备份」与「实体备份」的增量备份；</div>'
        + '<div>2、每季度 1 号 ' + _qt + ' 执行「工单备份」与「实体备份」的全量备份，目的是防止增量备份的遗漏。</div>'
        + '<div>3、自动备份由龙虾完成。</div>'
        + '<div>下次执行时间：周增量 ' + (esc(_wn) || '—') + '；季度全量 ' + (esc(_qn) || '—') + '。</div>'
        + '</div>';
  tc.innerHTML = html;
}

async function runSync(key) {
  const mode = (document.getElementById('sync_mode_'+key)||{}).value || 'incr';
  const month = (document.getElementById('sync_month_'+key)||{}).value || '';
  if (!confirm('确定运行该同步？（从云端拉取并写本地库）')) return;
  const params = new URLSearchParams({ task: key, mode: mode });
  if (month) params.set('month', month);
  try {
    const d = await (await fetch('/shb/api/sync?'+params.toString(), {method:'POST'})).json();
    if (!d.ok) { alert(d.error || '提交失败'); fetchSync(); return; }
    pollSync(d.job_id);
  } catch(e) { alert('网络错误：'+e.message); fetchSync(); }
}

async function pollSync(jobId) {
  fetchSync();
  while (true) {
    await new Promise(r=>setTimeout(r,3000));
    let d; try { d = await (await fetch('/shb/api/job?id='+jobId)).json(); } catch(e) { fetchSync(); return; }
    if (!d.ok) { fetchSync(); return; }
    if (d.status === 'ok') { fetchSync(); return; }
    if (d.status === 'failed') { alert('同步失败：'+(d.error||'')); fetchSync(); return; }
  }
}

  '      <div style="font-weight:600;color:#d63031;margin-bottom:6px;font-size:13px">注意事项</div>',
  '      <ul style="margin:0 0 0 18px;padding:0;color:#4b5563;font-size:13px;line-height:1.9">',
  '        <li><b>切换是全局的。</b>所有查询、同步、定时任务都改用新身份运行。</li>',
  '        <li><b>两个按钮不一样。</b>“切换”改全局默认；“生成授权链接”只给个人用，不改默认。</li>',
  '        <li><b>权限会变。</b>换成普通员工后，能查到的工单会变少，这是正常的。</li>',
  '        <li><b>链接只发本人。</b>授权必须本人用自己的售后宝账号确认，不能代点。</li>',
  '        <li><b>同一时间只能一个。</b>有授权任务在等待时，不能再生成新链接。</li>',
  '        <li><b>同一账号只能一处登录。</b>别处再登录会顶号，需重新授权。</li>',
  '        <li><b>自动备份与回滚。</b>切换前备份配置；切换后校验，失败自动回滚。</li>',
  '        <li><b>链接有效期约 30 分钟。</b>过期或被顶号，重新生成即可。</li>',
  '      </ul>',
  '    </div>',
  '  </div>',

].join('');

async function fetchIdentity() {
  const tc = document.getElementById('table-container');
  const loading = document.getElementById('loading'), error = document.getElementById('error');
  document.getElementById('pagination').style.display = 'none';
  loading.style.display = 'flex'; error.style.display = 'none'; tc.innerHTML = '';
  try {
    const d = await (await fetch('/shb/api/identity/list')).json();
    loading.style.display = 'none';
    if (!d.ok) { error.textContent = d.error || '读取失败'; error.style.display = 'block'; return; }
    let html = '<div style="padding:12px 16px">当前生效身份：<b>' + esc(d.current) + '</b>';
    if (d.waiting) html += '　<span style="color:#d63031">待授权中：' + esc(d.waiting) + '</span>';
    html += '</div>';
    html += '<table><thead><tr><th>身份标识</th><th>显示名</th><th>最后登录</th><th>当前</th><th>操作</th></tr></thead><tbody>';
    d.rows.forEach(r => {
      const cur = r['当前'] === '★';
      html += '<tr><td class="col-text">' + esc(r.profile) + '</td><td>' + esc(r['显示名']) + '</td><td>' + esc(r['最后登录']) + '</td><td>' + (cur ? '✓' : '') + '</td><td>';
      if (cur) {
        html += '—';
      } else {
        html += '<button class="btn-query" onclick="idSwitch(\'' + r.profile + '\')">切换</button> ';
        html += '<button class="btn-save" onclick="idAuth(\'' + r.profile + '\')">生成授权链接</button>';
      }
      html += '</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div id="id-msg" style="padding:12px 16px;color:#636e72;font-size:14px"></div>';
    html += '<div id="id-link" style="padding:0 16px 16px"></div>';
    html += ID_HELP_HTML;
    tc.innerHTML = html;
  } catch(e) {
    loading.style.display = 'none';
    error.textContent = '网络错误：' + e.message; error.style.display = 'block';
  }
}

async function idSwitch(profile, skipConfirm) {
  if (!skipConfirm && !confirm('切换后，所有查询、同步、定时任务都将使用「' + profile + '」的身份运行。确定切换？')) return;
  const msg = document.getElementById('id-msg');
  if (msg) msg.textContent = '正在探测并切换...';
  try {
    const d = await (await fetch('/shb/api/identity/switch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({profile: profile})
    })).json();
    if (d.ok && d.status === 'switched') { if (msg) msg.textContent = '已切换到 ' + d.current; fetchIdentity(); return; }
    if (d.ok && d.status === 'already') { if (msg) msg.textContent = 'ℹ 已是当前身份'; return; }
    if (d.ok && d.status === 'need_auth') {
      if (msg) {
        msg.innerHTML = '' + esc(d.message) + '　';
        const b = document.createElement('button');
        b.className = 'btn-save'; b.textContent = '立即生成授权链接';
        b.onclick = () => idAuth(profile);
        msg.appendChild(b);
      }
      return;
    }
    if (msg) msg.textContent = '' + (d.error || '切换失败');
  } catch(e) { if (msg) msg.textContent = '网络错误：' + e.message; }
}

async function idAuth(profile) {
  const msg = document.getElementById('id-msg'), linkBox = document.getElementById('id-link');
  if (msg) msg.textContent = '正在生成授权链接...';
  if (linkBox) linkBox.innerHTML = '';
  try {
    const d = await (await fetch('/shb/api/identity/authlink', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({profile: profile})
    })).json();
    if (!d.ok) { if (msg) msg.textContent = '' + (d.error || '生成失败'); return; }
    if (!d.url) { if (msg) msg.textContent = '未取到链接，请稍后重试'; return; }
    if (msg) msg.textContent = '链接已生成，仅发给本人，约 30 分钟内有效';
    if (linkBox) {
      const a = document.createElement('a');
      a.href = d.url; a.target = '_blank'; a.textContent = d.url;
      a.style.wordBreak = 'break-all';
      const wrap = document.createElement('div');
      wrap.style.cssText = 'background:#f8f9fa;border:1px solid #dfe6e9;border-radius:6px;padding:10px;font-size:13px;margin-bottom:8px';
      wrap.appendChild(a);
      const cb = document.createElement('button');
      cb.className = 'btn-export'; cb.textContent = '取消等待';
      cb.onclick = () => idCancel(profile);
      linkBox.appendChild(wrap);
      linkBox.appendChild(cb);
    }
    idPoll(profile);
  } catch(e) { if (msg) msg.textContent = '网络错误：' + e.message; }
}

async function idPoll(profile) {
  const msg = document.getElementById('id-msg');
  while (true) {
    await new Promise(r => setTimeout(r, 5000));
    let d;
    try {
      d = await (await fetch('/shb/api/identity/authstatus?profile=' + encodeURIComponent(profile))).json();
    } catch(e) { if (msg) msg.textContent = '状态查询失败：' + e.message; return; }
    if (!d.ok) return;
    if (d.status === 'waiting') {
      if (msg) msg.textContent = '等待本人确认授权（已 ' + (d.elapsed || 0) + ' 秒）...';
      continue;
    }
    if (d.status === 'success') {
      if (msg) msg.textContent = '授权成功，正在切换身份...';
      await idSwitch(profile, true);
      return;
    }
    if (d.status === 'timeout' || d.status === 'none') {
      if (msg) msg.textContent = '⌛ 授权未完成（超时或已取消），可重新生成链接';
      return;
    }
    return;
  }
}

async function idCancel(profile) {
  const msg = document.getElementById('id-msg'), linkBox = document.getElementById('id-link');
  try {
    await fetch('/shb/api/identity/cancel', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({profile: profile})
    });
    if (msg) msg.textContent = '已取消等待';
    if (linkBox) linkBox.innerHTML = '';
  } catch(e) { if (msg) msg.textContent = '取消失败：' + e.message; }
}

// ══ 账号管理（登录账号 + Tab 权限）══
// uaRows：当前列表；uaTabsMeta：全部可选 Tab（key + 中文名）；uaEditing：正在编辑的用户名（null=新增）
let uaRows = [], uaTabsMeta = [], uaEditing = null;

function switchToUsersAccount() {
  isUsersAccountTab = true;
  isAuditTab = isSyncTab = isSyncLogTab = isIdTab = false;
  document.getElementById('form-row').style.display = 'none';
  document.getElementById('form-row-custom').style.display = 'none';
  document.getElementById('export-btn').style.display = 'none';
  document.getElementById('audit-filter').style.display = 'none';
  renderPersonBar(null);
  renderMenu();
  fetchUsersAccount();
}

// 统一请求处理：区分「登录失效/无权限/服务异常」，避免把 HTML 错误页当 JSON 解析
async function uaFetchJson(url, opts) {
  const resp = await fetch(url, opts);
  if (!resp.ok) {
    if (resp.status === 401) throw new Error('登录已失效，请关闭所有浏览器窗口后重新打开并登录');
    if (resp.status === 403) throw new Error('仅管理员可操作，请用 admin 账号登录');
    throw new Error('请求失败（HTTP ' + resp.status + '）');
  }
  const ct = (resp.headers.get('content-type') || '').toLowerCase();
  if (ct.indexOf('json') < 0) throw new Error('服务返回异常，请刷新页面后重试');
  return resp.json();
}

async function fetchUsersAccount() {
  const tc = document.getElementById('table-container');
  const loading = document.getElementById('loading'), error = document.getElementById('error');
  loading.style.display = 'flex'; error.style.display = 'none'; tc.innerHTML = '';
  document.getElementById('pagination').style.display = 'none';
  try {
    const d = await uaFetchJson('/shb/api/users-account');
    loading.style.display = 'none';
    if (!d.ok) { error.textContent = d.error || '加载失败'; error.style.display = 'block'; return; }
    uaRows = d.rows || []; uaTabsMeta = d.tabs || [];
    renderUsersAccount();
  } catch (e) {
    loading.style.display = 'none';
    error.textContent = '网络错误：' + e.message; error.style.display = 'block';
  }
}

function uaTabTitle(key) {
  const hit = uaTabsMeta.find(t => t.key === key);
  return hit ? hit.title : key;
}

function renderUsersAccount() {
  const tc = document.getElementById('table-container');
  let html = '<div style="display:flex;justify-content:space-between;align-items:center;padding:0 0 10px">';
  html += '<div style="font-size:15px;font-weight:600;color:#15324e">账号管理</div>';
  html += '<button class="btn-query" onclick="openUaModal(-1)">+ 新增用户</button></div>';
  html += '<table><thead><tr><th style="width:150px">用户名</th><th style="width:110px">登录密码</th>'
        + '<th>可访问 Tab</th><th style="width:150px">操作</th></tr></thead><tbody>';
  uaRows.forEach((r, i) => {
    const pw = r.has_password
      ? '<span style="color:#00b894;font-weight:600">已设置</span>'
      : '<span style="color:#d63031;font-weight:600">未设置</span>';
    let chips;
    if (r.is_admin) {
      chips = '<span class="chip active">全部权限</span>';
    } else if (!r.tabs.length) {
      chips = '<span style="color:#999">未分配</span>';
    } else {
      chips = r.tabs.map(t => '<span class="chip">' + esc(uaTabTitle(t)) + '</span>').join('');
    }
    html += '<tr><td class="col-text" style="font-weight:600">' + esc(r.user)
          + (r.is_admin ? ' <span style="color:#d63031;font-weight:400">(内置)</span>' : '') + '</td>';
    html += '<td>' + pw + '</td><td class="col-wrap">' + chips + '</td><td>';
    html += '<button class="btn-query" onclick="openUaModal(' + i + ')">'
          + (r.is_admin ? '改密码' : '编辑') + '</button> ';
    if (!r.is_admin) {
      html += '<button class="btn-save" style="background:#d63031" onclick="deleteUaUser(' + i + ')">删除</button>';
    }
    html += '</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div style="padding:14px 2px;color:#6b7280;font-size:12px;line-height:1.9">'
        + '说明：新增用户会同时写入登录账号与 Tab 权限，保存后即可用该用户名登录。'
        + 'admin 为内置管理员，固定拥有全部权限，只能改密码。</div>';
  tc.innerHTML = html;
}

function openUaModal(idx) {
  const isEdit = idx >= 0;
  const row = isEdit ? uaRows[idx] : null;
  uaEditing = isEdit ? row.user : null;
  const selected = isEdit ? (row.tabs || []) : [];

  let html = '<div style="font-weight:600;font-size:15px;margin-bottom:14px">'
           + (isEdit ? '编辑用户：' + esc(row.user) : '新增用户') + '</div>';
  html += '<div class="form-group" style="margin-bottom:12px"><label>用户名</label>'
        + '<input type="text" id="ua_user" value="' + esc(isEdit ? row.user : '')
        + '" placeholder="字母/数字/下划线，如 zhangsan"' + (isEdit ? ' readonly' : '') + '></div>';
  html += '<div class="form-group" style="margin-bottom:6px"><label>'
        + (isEdit ? '重置密码（留空表示不修改）' : '登录密码') + '</label>'
        + '<input type="password" id="ua_pw" placeholder="' + (isEdit ? '留空=不改' : '至少 6 位')
        + '" autocomplete="new-password"></div>';

  if (!(isEdit && row.is_admin)) {
    html += '<div class="form-group" style="margin-top:12px"><label>可访问 Tab</label>'
          + '<div style="display:flex;gap:8px;margin:4px 0 8px">'
          + '<button type="button" class="chip" onclick="uaToggleAll(1)">全选</button>'
          + '<button type="button" class="chip" onclick="uaToggleAll(0)">清空</button></div>'
          + '<div id="ua_chips" style="display:flex;flex-wrap:wrap;gap:6px;max-height:280px;overflow:auto">';
    uaTabsMeta.forEach(t => {
      const on = selected.indexOf(t.key) >= 0;
      html += '<button type="button" class="chip' + (on ? ' active' : '')
            + '" data-key="' + esc(t.key) + '" onclick="this.classList.toggle(\'active\')">'
            + esc(t.title) + '</button>';
    });
    html += '</div></div>';
  } else {
    html += '<div style="margin-top:12px;color:#6b7280;font-size:13px">该账号为内置管理员，固定拥有全部权限。</div>';
  }

  html += '<div id="ua_msg" style="margin-top:10px;font-size:13px;color:#d63031"></div>';
  html += '<div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">'
        + '<button class="btn-query" style="background:#95a5a6" onclick="closeUaModal()">取消</button>'
        + '<button class="btn-save" id="ua_submit" onclick="saveUaUser()">保存</button></div>';

  const box = document.createElement('div');
  box.id = 'ua_modal';
  box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  box.innerHTML = '<div style="background:#fff;border-radius:10px;padding:20px;width:560px;max-width:100%;max-height:88vh;overflow:auto">' + html + '</div>';
  box.onclick = e => { if (e.target === box) closeUaModal(); };
  document.body.appendChild(box);
}

function uaToggleAll(on) {
  document.querySelectorAll('#ua_chips .chip').forEach(b => b.classList.toggle('active', !!on));
}

function closeUaModal() {
  const box = document.getElementById('ua_modal');
  if (box) box.remove();
}

async function saveUaUser() {
  const nameInp = document.getElementById('ua_user');
  const pwInp = document.getElementById('ua_pw');
  const msg = document.getElementById('ua_msg');
  const btn = document.getElementById('ua_submit');
  const name = (nameInp.value || '').trim();
  const password = (pwInp.value || '');
  const tabs = Array.from(document.querySelectorAll('#ua_chips .chip.active')).map(b => b.dataset.key);

  msg.textContent = '';
  if (!name) { msg.textContent = '用户名不能为空'; return; }
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const d = await uaFetchJson('/shb/api/users-account', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user: name, tabs: tabs, password: password})
    });
    if (!d.ok) { msg.textContent = d.error || '保存失败'; btn.disabled = false; btn.textContent = '保存'; return; }
    closeUaModal();
    fetchUsersAccount();
  } catch (e) {
    msg.textContent = '网络错误：' + e.message;
    btn.disabled = false; btn.textContent = '保存';
  }
}

async function deleteUaUser(idx) {
  const row = uaRows[idx];
  if (!row) return;
  if (!confirm('确定删除用户「' + row.user + '」？\n将同时移除登录账号与 Tab 权限，删除后无法登录。')) return;
  try {
    const d = await uaFetchJson('/shb/api/users-account/' + encodeURIComponent(row.user),
                                {method: 'DELETE'});
    if (!d.ok) { alert('删除失败：' + (d.error || '未知错误')); return; }
    fetchUsersAccount();
  } catch (e) { alert('网络错误：' + e.message); }
}
